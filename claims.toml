[C23]
target = "smoke-llm"
metric = "all_checks_passed"
op = "eq"
value = true


[C01]
name = "Time To First Audio"
blueprint = "C1"
profile = "contract"
observed_at = "egress"
unit = "milliseconds"

[C01.protocol]
warmup_excluded = 20
order = "randomized"
failed_turns = "counted_above_800_ms"
trimming = "None"
confidence = 0.95
ci_method = "exact_binomial"

[C01.tier.reported]
target = "bench-ttfa-cp"
min_n = 500

[C01.tier.certified]
target = "certify"
min_n = 2000

[[C01.check]]
name = "fraction_above_800ms_upper_bound"
metric = "fraction_above_800ms_upper_bound"
op = "le"
value = 0.05

[[C01.check]]
name = "fraction_bellow_500ms_lower_bound"
metric = "fraction_bellow_500ms_lower_bound"
op = "ge"
value = 0.50

[C01.evidence]
producer = "bench/ttfa_cp.py"
raw_data = "bench/data/ttfa_cp.jsonl"
output = "bench/out/C01.json"
reproduce = "make reproduce CLAIM=C01"
frozen_in = ""
